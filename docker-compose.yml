services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: always
    
  init:
    build: .
    user: root
    command: >
      sh -c "
        chown -R app:app /app/media /app/staticfiles &&
        chmod -R 755 /app/media &&
        python manage.py migrate --noinput &&
        python manage.py collectstatic --noinput &&
        chown -R app:app /app/media /app/staticfiles
      "
    env_file: .env
    environment:
      DB_HOST: db
    volumes:
      - media_data:/app/media
      - static_data:/app/staticfiles
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  web:
    build: .
    env_file: .env
    environment:
      DB_HOST: db
    volumes:
      - media_data:/app/media
      - static_data:/app/staticfiles:ro
    depends_on:
      init:
        condition: service_completed_successfully
    expose:
      - "8000"
    command: gunicorn skyconnect.wsgi:application --bind 0.0.0.0:8000 --access-logfile - --error-logfile -
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent -H 'X-Forwarded-Proto: https' http://localhost:8000/healthz/ > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    restart: always

  cron:
    build: .
    env_file: .env
    environment:
      DB_HOST: db
    volumes:
      - media_data:/app/media
    depends_on:
      init:
        condition: service_completed_successfully
    command: >
      sh -c '
        if [ "$${RADIUS_SYNC_ENABLED:-False}" = "True" ]; then
          while true; do python manage.py sync_tickets_to_radius; sleep 60; done;
        else
          echo "Synchronisation RADIUS désactivée";
          tail -f /dev/null;
        fi
      '
    restart: always
    
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - media_data:/app/media:ro
      - static_data:/app/staticfiles:ro
      - ./certbot/www:/var/www/certbot:ro
      - ./certbot/conf:/etc/letsencrypt:ro
    depends_on:
      web:
        condition: service_healthy

  certbot:
    image: certbot/certbot:latest
    profiles: ["tools"]
    volumes:
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt

volumes:
  postgres_data:
  media_data:
  static_data:
