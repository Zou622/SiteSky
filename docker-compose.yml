services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always
    
  web:
    build: .
    user: root
    command: >
      sh -c "
        chown -R app:app /app/media /app/staticfiles &&
        chmod -R 755 /app/media &&
        cron &&
        exec gunicorn skyconnect.wsgi:application --bind 0.0.0.0:80
      "
    env_file: .env
    environment:
      DB_HOST: db
    volumes:
      - ./.env:/app/.env:ro
      - media_data:/app/media
      - static_data:/app/staticfiles
    depends_on:
      - db
    expose:
      - "8000"
    restart: always
    
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - media_data:/app/media:ro
      - static_data:/app/staticfiles:ro
    depends_on:
      - web

volumes:
  postgres_data:
  media_data:
  static_data: